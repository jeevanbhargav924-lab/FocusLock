<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Lock - Legal Documents & Policies</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-color: #4f8cff;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0 0 8px 0;
            color: #ffffff;
        }
        p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            background-color: #21262d;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 14px;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #ffffff;
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔒</div>
        <h1>Focus Lock Legal</h1>
        <p>Google Play Store Policy & Legal Information for Focus Lock (com.focuslock.productivity)</p>
        
        <a href="privacy-policy.html" class="btn">📄 View Privacy Policy</a>
        <a href="terms-and-conditions.html" class="btn">⚖️ View Terms & Conditions</a>

        <div class="footer">
            Contact: <a href="mailto:jeevanbhargav286@gmail.com" style="color: var(--accent-color); text-decoration: none;">jeevanbhargav286@gmail.com</a>
        </div>
    </div>
</body>
</html>
